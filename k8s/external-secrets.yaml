apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-secrets
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backstage-secrets
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: secret/backstage/credentials
        property: github_token
    
    - secretKey: AUTH_GITHUB_CLIENT_ID
      remoteRef:
        key: secret/backstage/credentials
        property: auth_github_client_id
    
    - secretKey: AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        key: secret/backstage/credentials
        property: auth_github_client_secret
    
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: secret/backstage/credentials
        property: postgres_host
    
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: secret/backstage/credentials
        property: postgres_port
    
    - secretKey: POSTGRES_USER
      remoteRef:
        key: secret/backstage/credentials
        property: postgres_user
    
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/backstage/credentials
        property: postgres_password
    
    - secretKey: POSTGRES_DB
      remoteRef:
        key: secret/backstage/credentials
        property: postgres_db
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: backstage
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "backstage"
          serviceAccountRef:
            name: "backstage"
